# CodeQL Advanced Setup - PR脆弱性自動検出
#
# このワークフローは以下の機能を提供します:
# - PRにコミットが追加された際の自動セキュリティスキャン
# - 検出された脆弱性のPRへの自動アノテーション表示
# - マージ前のセキュリティチェック

name: "CodeQL"

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 0 * * 1'  # 毎週月曜日に実行

permissions:
  security-events: write
  contents: read
  pull-requests: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===================================
          # 対象言語に応じて以下を調整してください
          # ===================================
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # 他の言語を追加する場合:
          # - language: python
          #   build-mode: none
          # - language: go
          #   build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # PR に Code scanning の結果（アラート一覧・修正提案の概要）をコメントする。期待: コードの修正提案がコメントされる。
  post-scan-comment:
    name: Post code scanning summary to PR
    needs: analyze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      security-events: read
      pull-requests: write
      contents: read
    steps:
      - name: Wait for alerts to be available
        run: sleep 45
      - name: Fetch alerts and post comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request.number;
            const { data: alerts } = await github.rest.codeScanning.listAlertsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pr,
              state: 'open'
            });
            const lines = ['## Code scanning 結果（この PR）', ''];
            if (alerts.length === 0) {
              lines.push('新規アラートは 0 件です。');
            } else {
              lines.push(`**${alerts.length} 件のアラート**が検出されました。修正を検討してください。`);
              lines.push('');
              for (const a of alerts.slice(0, 20)) {
                const loc = a.most_recent_instance?.location;
                const path = loc?.path || '-';
                const line = loc?.start_line ?? '-';
                const msg = (a.most_recent_instance?.message?.text || a.rule?.description || '').slice(0, 120);
                lines.push(`- **${a.rule?.name || a.rule?.id}** (${path}:${line})`);
                lines.push(`  ${msg}`);
                if (a.html_url) lines.push(`  [詳細・修正方法](${a.html_url})`);
                lines.push('');
              }
              if (alerts.length > 20) lines.push(`他 ${alerts.length - 20} 件。Security タブで確認してください。`, '');
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: lines.join('\n')
            });
